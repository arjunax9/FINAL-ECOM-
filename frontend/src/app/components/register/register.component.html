<div class="auth-page container">
  <div class="auth-card card">
    <div class="auth-header">
      <div class="auth-icon-circle">
        <i class="fa-solid fa-user-plus"></i>
      </div>
      <h1 class="auth-title">Create Account</h1>
      <p class="auth-subtitle">Join ApexStore to track orders, save shipping preferences, and enjoy fast checkout.</p>
    </div>

    <!-- Feedback Alerts -->
    <div *ngIf="successMessage" class="alert alert-success">
      <i class="fa-solid fa-circle-check"></i>
      <span>{{ successMessage }}</span>
    </div>
    <div *ngIf="error" class="alert alert-danger">
      <i class="fa-solid fa-circle-exclamation"></i>
      <span>{{ error }}</span>
    </div>

    <!-- Form -->
    <form (ngSubmit)="submit()" [formGroup]="form" class="auth-form">
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <div class="input-with-icon">
          <i class="fa-regular fa-user input-icon"></i>
          <input
            type="text"
            formControlName="name"
            class="form-control"
            placeholder="e.g. Alex Johnson"
          />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Email Address</label>
        <div class="input-with-icon">
          <i class="fa-regular fa-envelope input-icon"></i>
          <input
            type="email"
            formControlName="email"
            class="form-control"
            placeholder="alex@example.com"
          />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="input-with-icon">
          <i class="fa-solid fa-lock input-icon"></i>
          <input
            type="password"
            formControlName="password"
            class="form-control"
            placeholder="At least 6 characters"
          />
        </div>
      </div>

      <button type="submit" [disabled]="form.invalid || loading" class="btn btn-primary btn-lg submit-btn">
        <i *ngIf="!loading" class="fa-solid fa-arrow-right"></i>
        <i *ngIf="loading" class="fa-solid fa-circle-notch fa-spin"></i>
        <span>{{ loading ? 'Creating Account...' : 'Complete Registration' }}</span>
      </button>
    </form>

    <div class="auth-footer">
      <span>Already have an account?</span>
      <a routerLink="/login" class="auth-link">Sign In</a>
    </div>
  </div>
</div>
