name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  backend-matrix:
    name: Build & Validate Backend Microservices
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: AuthService
            path: Services/ECommerce.AuthService/ECommerce.AuthService.csproj
          - name: ProductService
            path: Services/ECommerce.ProductService/ECommerce.ProductService.csproj
          - name: OrderService
            path: Services/ECommerce.OrderService/ECommerce.OrderService.csproj
          - name: ApiGateway
            path: Services/ECommerce.ApiGateway/ECommerce.ApiGateway.csproj
          - name: AIService
            path: Services/ECommerce.AIService/ECommerce.AIService.csproj
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore ${{ matrix.service.path }}

      - name: Build Service (${{ matrix.service.name }})
        run: dotnet build ${{ matrix.service.path }} -c Release --no-restore

  backend-tests:
    name: Run Automated Microservices Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Solution
        run: dotnet restore ECommerceAPI.slnx

      - name: Run xUnit Test Suite
        run: dotnet test ECommerceAPI.slnx --no-restore --verbosity normal

  frontend-build:
    name: Build & Validate Angular Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Compile Angular Production Bundle
        working-directory: frontend
        run: npm run build -- --configuration=production

  kubernetes-validate:
    name: Lint & Dry-Run Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Kustomization and Manifests
        run: |
          if [ -d "k8s" ]; then
            kustomize build k8s/ > /dev/null
            echo "K8s Kustomize syntax check passed!"
          else
            echo "Notice: k8s directory not present, skipping manifest check."
          fi
