apiVersion: v1
kind: ConfigMap
metadata:
  name: ecommerce-config
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: ecommerce-config
    app.kubernetes.io/part-of: ecommerce-platform
data:
  ASPNETCORE_ENVIRONMENT: "Development"
  JWT_ISSUER: "ECommerceAPI"
  JWT_AUDIENCE: "ECommerceUsers"
  
  # Microservices In-Cluster DNS Endpoints
  AUTH_SERVICE_URL: "http://auth-service:5001/"
  PRODUCT_SERVICE_URL: "http://product-service:5002/"
  ORDER_SERVICE_URL: "http://order-service:5003/"
  AI_SERVICE_URL: "http://ai-service:5004/"
  GATEWAY_URL: "http://api-gateway:5000/"

  # Azure AI Service Configuration
  AZURE_AI_ENDPOINT: "https://ibmmart.services.ai.azure.com"
  AZURE_AI_CHAT_DEPLOYMENT: "gpt-4.1-mini"
  AZURE_AI_EMBEDDING_DEPLOYMENT: "text-embedding-3-small"
  AZURE_AI_API_VERSION: "2024-06-01"
  AZURE_AI_PROJECT_ID: "proj-default"
  AZURE_AI_WORKSPACE_URL: "https://ibmmart.services.ai.azure.com/api/projects/proj-default"
