apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secrets
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: ecommerce-secrets
    app.kubernetes.io/part-of: ecommerce-platform
type: Opaque
stringData:
  # Database SA credentials
  MSSQL_SA_PASSWORD: "Password123!"

  # Microservice Default Connection Strings
  AUTH_DB_CONNECTION: "Server=sqlserver,1433;Database=ECommerce_AuthDB;User Id=sa;Password=Password123!;TrustServerCertificate=True;"
  PRODUCT_DB_CONNECTION: "Server=sqlserver,1433;Database=ECommerce_ProductDB;User Id=sa;Password=Password123!;TrustServerCertificate=True;"
  ORDER_DB_CONNECTION: "Server=sqlserver,1433;Database=ECommerce_OrderDB;User Id=sa;Password=Password123!;TrustServerCertificate=True;"

  # JWT Signing Secret
  JWT_SECRET_KEY: "ThisIsMyVerySimpleSecretKeyForECommerceProject12345"

  # Azure AI Credentials
  AZURE_AI_API_KEY: "YOUR_AZURE_AI_API_KEY"
