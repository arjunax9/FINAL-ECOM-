apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-api-gateway
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: ecommerce-api-gateway
    app.kubernetes.io/part-of: ecommerce-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ecommerce-api-gateway
  template:
    metadata:
      labels:
        app: ecommerce-api-gateway
    spec:
      containers:
        - name: api-gateway
          image: ecommerce-api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: ASPNETCORE_ENVIRONMENT
            - name: ASPNETCORE_HTTP_PORTS
              value: "5000"
            - name: ASPNETCORE_URLS
              value: "http://+:5000"
            - name: ReverseProxy__Clusters__auth-cluster__Destinations__auth-destination__Address
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: AUTH_SERVICE_URL
            - name: ReverseProxy__Clusters__product-cluster__Destinations__product-destination__Address
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: PRODUCT_SERVICE_URL
            - name: ReverseProxy__Clusters__order-cluster__Destinations__order-destination__Address
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: ORDER_SERVICE_URL
            - name: ReverseProxy__Clusters__ai-cluster__Destinations__ai-destination__Address
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: AI_SERVICE_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: ecommerce-api-gateway
    app.kubernetes.io/part-of: ecommerce-platform
spec:
  type: ClusterIP
  selector:
    app: ecommerce-api-gateway
  ports:
    - port: 5000
      targetPort: 5000
      name: http

