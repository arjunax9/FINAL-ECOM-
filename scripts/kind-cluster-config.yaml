kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ecommerce-cluster
networking:
  apiServerAddress: "0.0.0.0"
  apiServerPort: 6443
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 5000
        hostPort: 5000
        protocol: TCP

